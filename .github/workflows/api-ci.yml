name: API CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
        working-directory: apps/api
